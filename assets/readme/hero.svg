<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="fg-title fg-desc">
  <title id="fg-title">Fluid Glass UI</title>
  <desc id="fg-desc">Fluid Glass UI: production-grade WebGL fluid glass metric cards with a fixed canonical material core and open business configuration, shown as three tilting glass cards assembled by a fluid flow line.</desc>
