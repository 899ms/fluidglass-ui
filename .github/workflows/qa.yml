name: Package QA

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  qa:
    name: Package integrity and canonical core check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run package QA
        run: python tools/package_qa.py

      - name: Check engine JavaScript syntax
        run: node --check references/fluid-glass-engine.js
